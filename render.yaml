# Render blueprint: Django API (migrates and seeds the demo catalogue on start) + managed PostgreSQL.
# ALLOWED_HOSTS and CSRF origins pick up RENDER_EXTERNAL_HOSTNAME automatically.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ecommerce-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: SEED_DEMO_ON_START
        value: "true"
      - key: VAT_RATE
        value: "0.05"
      - key: RESERVATION_TTL_MINUTES
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: BKASH_WEBHOOK_SECRET
        generateValue: true
      - key: SSLCOMMERZ_WEBHOOK_SECRET
        generateValue: true

databases:
  - name: ecommerce-db
    plan: free
    databaseName: ecommerce
    user: ecommerce
